name: Screenshots

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    name: Capture README screenshots from the demo database
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      COMPOSE_PROJECT_NAME: workforce_ops_shots_${{ github.run_id }}_${{ github.run_attempt }}
      ODOO_DB_PASSWORD: odoo
      ODOO_DBFILTER: ^workforce_ops_demo$
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare output directories
        shell: bash
        run: mkdir -p docs/screenshots ci-artifacts

      - name: Start PostgreSQL
        shell: bash
        run: docker compose up -d --wait --wait-timeout 120 db

      - name: Create database with the module and demo data
        shell: bash
        run: |
          docker compose run --rm -T --no-deps web odoo \
            -d workforce_ops_demo -i workforce_ops --with-demo \
            --stop-after-init --no-http --workers=0 --max-cron-threads=0 \
            --log-level=warn

      - name: Seed screenshot sample data
        shell: bash
        run: |
          docker compose run --rm -T --no-deps web odoo shell \
            -d workforce_ops_demo < ci/seed_screenshots_data.py 2>&1 | tee ci-artifacts/seed.log
          grep -q 'SEED_COUNTS job_orders=11 workers=13 placements=11 admin_manager=True' ci-artifacts/seed.log
          grep -q 'SEED_OK' ci-artifacts/seed.log

      - name: Boot the Odoo web client
        shell: bash
        run: docker compose up -d web

      - name: Wait for Odoo on http://localhost:8069
        shell: bash
        run: |
          for attempt in $(seq 1 90); do
            code="$(curl --silent --output /dev/null --write-out '%{http_code}' \
              --connect-timeout 3 --max-time 10 http://localhost:8069/web/login || true)"
            if [ "$code" = "200" ]; then
              echo "Odoo answered with HTTP 200 after ${attempt} attempt(s)."
              exit 0
            fi
            sleep 2
          done
          echo "Odoo did not answer with HTTP 200 on http://localhost:8069" >&2
          docker compose logs --no-color web >&2
          exit 1

      - name: Install Playwright and Chromium
        shell: bash
        working-directory: ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: |
          node --version
          npm --version
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Ensure PDF rasterizer
        shell: bash
        run: |
          if ! command -v pdftoppm >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y poppler-utils
          fi

      - name: Capture screenshots
        shell: bash
        run: node ci/screenshots.mjs

      - name: List screenshot files
        if: always()
        shell: bash
        run: ls -l docs/screenshots || true

      - name: Collect logs
        if: always()
        shell: bash
        run: |
          docker compose ps > ci-artifacts/compose-ps.txt 2>&1 || true
          docker compose logs --no-color db > ci-artifacts/db.log 2>&1 || true
          docker compose logs --no-color web > ci-artifacts/odoo.log 2>&1 || true

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: workforce-ops-screenshots-${{ github.run_id }}-${{ github.run_attempt }}
          path: docs/screenshots/
          retention-days: 14
          if-no-files-found: error

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: workforce-ops-screenshots-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-artifacts/
          retention-days: 14
          if-no-files-found: warn

      - name: Cleanup Docker resources
        if: always()
        shell: bash
        run: docker compose down --volumes --remove-orphans
